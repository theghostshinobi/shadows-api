# `shadow-compliance` — il report d'audit (§8, §9 Fase 5).
#
# Si chiamava `shadow-report` in §8 fino al 2026-09-05, quando il fondatore ha
# sciolto la collisione con l'identificatore dello schema JSON `shadow-report/1`
